<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0a10">
<title>الجاسوس حمزة</title>
<style>
:root{--bg:#0b0a10;--card:#1b1522;--card2:#2a2033;--txt:#fff6ee;--mut:#b9a9c4;--red:#ff2d3f;--grn:#27e07a;--gold:#ffc83d;--blue:#3d8bff;--orange:#ff7a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;overflow:hidden;
 background:radial-gradient(ellipse at 50% -10%,#5a1220 0%,#1d0c18 45%,#07060b 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 14px)}
#app{position:relative;height:100%;overflow-y:auto;padding:18px 16px 30px;display:flex;flex-direction:column;align-items:center;max-width:520px;margin:0 auto}
h1{font-size:44px;margin:4px 0;text-align:center;font-weight:900;background:linear-gradient(180deg,#fff2c2,#ffb300 55%,#ff3d00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a1000) drop-shadow(0 0 18px rgba(255,90,0,.55));letter-spacing:1px}
h2{font-size:23px;margin:8px 0 12px;text-align:center;text-shadow:0 2px 0 #000}
p{line-height:1.7;text-align:center;margin:6px 0}
.mut{color:var(--mut);font-size:14px}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-size:19px;font-weight:800;color:#fff;margin:8px 0;cursor:pointer;font-family:inherit;
 background:linear-gradient(180deg,#5b9bff,#2a64d8);box-shadow:0 6px 0 #173c85,0 10px 18px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #173c85}
.btn.red{background:linear-gradient(180deg,#ff5a68,#d61226);box-shadow:0 6px 0 #78000d,0 10px 18px rgba(0,0,0,.45)}
.btn.grn{background:linear-gradient(180deg,#46f09a,#13b05a);color:#04210f;box-shadow:0 6px 0 #0a6a37,0 10px 18px rgba(0,0,0,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#ffa800);color:#3a2400;box-shadow:0 6px 0 #9a6200,0 10px 18px rgba(0,0,0,.45)}
.btn.dark{background:linear-gradient(180deg,#463a55,#2a2033);box-shadow:0 6px 0 #130d19,0 10px 18px rgba(0,0,0,.45)}
.btn:disabled{opacity:.4}
.card{width:100%;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;margin:8px 0;box-shadow:0 8px 22px rgba(0,0,0,.4)}
input[type=text]{width:100%;padding:13px;border-radius:14px;border:2px solid #3b2d49;background:#120d19;color:var(--txt);font-size:17px;font-family:inherit;user-select:text}
input[type=text]:focus{outline:0;border-color:var(--gold)}
.row{display:flex;gap:8px;width:100%;align-items:center;margin:5px 0}
.row .x{width:46px;height:46px;border:0;border-radius:12px;background:var(--card2);color:var(--red);font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cat{background:linear-gradient(180deg,#3a2c49,#2a2033);border:3px solid transparent;border-radius:16px;padding:14px 6px;text-align:center;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #130d19}
.cat:active{transform:translateY(3px)}
.cat.sel{border-color:var(--gold);background:linear-gradient(180deg,#5a4320,#3a2c49);box-shadow:0 0 18px rgba(255,200,61,.45)}
.big{font-size:58px;text-align:center;margin:8px 0;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-3deg)}}
.word{font-size:40px;font-weight:900;text-align:center;margin:16px 0;color:var(--grn);text-shadow:0 0 18px rgba(39,224,122,.5)}
.spyword{color:var(--red);font-size:56px;text-shadow:0 0 26px var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.09)}}
.stepper{display:flex;align-items:center;gap:18px;justify-content:center;margin:6px 0}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(180deg,#ffe07a,#ffa800);color:#3a2400;font-size:28px;font-weight:900;box-shadow:0 4px 0 #9a6200}
.stepper b{font-size:30px;min-width:34px;text-align:center}
.top{display:flex;justify-content:space-between;width:100%;align-items:center}
.back{background:none;border:0;color:var(--mut);font-size:16px;font-family:inherit;padding:6px}
.pname{color:var(--gold);text-shadow:0 0 14px rgba(255,200,61,.6)}
/* roulette arena */
.arena{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;margin:2px 0}
.ptr{color:var(--red);font-size:30px;line-height:1;filter:drop-shadow(0 0 8px var(--red));margin-bottom:-6px;z-index:3;animation:bob 1.2s infinite}
#cylsvg{width:210px;height:210px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
#cyl{transition:transform 1.7s cubic-bezier(.12,.75,.15,1);transform-origin:100px 100px}
.gunwrap{cursor:pointer;margin-top:-2px;width:100%;max-width:380px;position:relative}
.gunwrap svg{width:100%;height:auto;filter:drop-shadow(0 14px 12px rgba(0,0,0,.65));overflow:visible}
.gunwrap.recoil svg{animation:recoil .55s ease-out}
@keyframes recoil{0%{transform:translateX(0) rotate(0)}15%{transform:translateX(-26px) rotate(-9deg)}100%{transform:translateX(0) rotate(0)}}
#hammer{transform-origin:62px 62px;transition:transform .25s}
#hammer.cock{transform:rotate(-26deg)}
#hammer.fall{transition:transform .06s;transform:rotate(6deg)}
#mflash{opacity:0;transform-origin:393px 83px}
#mflash.go{animation:mf .35s ease-out}
@keyframes mf{0%{opacity:1;transform:scale(.3)}30%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(2)}}
.tapme{font-size:15px;color:var(--gold);animation:pulse 1.2s infinite;margin:2px 0 6px}
.flash{animation:flash .6s}
@keyframes flash{0%{background:#ff2d3f}100%{background:transparent}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.hole{position:fixed;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#000 0 35%,#2b2b2b 36% 55%,transparent 60%);z-index:50;pointer-events:none;animation:holein .2s}
@keyframes holein{from{transform:scale(2.2);opacity:0}}
.smoke{position:fixed;font-size:60px;z-index:49;pointer-events:none;animation:smoke 2s ease-out forwards}
@keyframes smoke{to{transform:translateY(-160px) scale(2.4);opacity:0}}
.result{animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(.4);opacity:0}}
/* countdown */
.cd{font-size:180px;font-weight:900;text-align:center;color:var(--gold);animation:pop .9s;text-shadow:0 0 50px var(--orange),0 6px 0 #7a3b00}
@keyframes pop{0%{transform:scale(2.6) rotate(-12deg);opacity:0}30%{opacity:1}100%{transform:scale(.8) rotate(4deg);opacity:.2}}
.spyname{font-size:40px;font-weight:900;color:var(--red);text-align:center;animation:pulse .8s infinite;text-shadow:0 0 22px var(--red),0 4px 0 #500;margin:6px 0}
.rank{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#34283f,#2a2033);margin:6px 0;width:100%;font-size:18px;box-shadow:0 3px 0 #130d19}
.rank.first{background:linear-gradient(90deg,#7a5a00,#3a2c49);border:2px solid var(--gold);box-shadow:0 0 22px rgba(255,200,61,.4)}
.confetti{position:fixed;top:-20px;font-size:26px;animation:fall 3s linear forwards;pointer-events:none;z-index:60}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tip{background:#2a2033;border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px;text-align:center;width:100%}
.logo-row{display:flex;gap:10px;justify-content:center;font-size:30px;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- بيانات ---------- */
const CATS = {
  islam:{n:"🕋 إسلامية",w:["غزوة بدر","غزوة أحد","الكعبة","رمضان","الحج","سيدنا موسى","سيدنا يوسف","الصلاة","الزكاة","المدينة المنورة","الإسراء والمعراج","سورة الفاتحة","أبو بكر الصديق","عمر بن الخطاب","الهجرة النبوية","عيد الأضحى","سيدنا نوح","ليلة القدر","الأذان","زمزم"]},
  christ:{n:"✝️ مسيحية",w:["عيد الميلاد","القيامة","العشاء الأخير","سفينة نوح","داود وجليات","الصوم الكبير","الأنبا بيشوي","الكنيسة","الإنجيل","الصليب","العذراء مريم","القديس مار جرجس","عيد الغطاس","سيدنا إبراهيم","يونان والحوت","الرسل الاثنا عشر","الأحد الشعانين","دير وادي النطرون","البابا","التناول"]},
  fruit:{n:"🍎 فواكه وخضروات",w:["جوافة","مانجو","فراولة","بطيخ","رمان","تفاح","موز","عنب","برتقال","طماطم","خيار","بطاطس","جزر","باذنجان","فلفل أخضر","كوسة","بصل","ثوم","تين","كمثرى"]},
  eg:{n:"🎬 أفلام مصري",w:["اللمبي","إسماعيلية رايح جاي","الجزيرة","هلس","ولاد رزق","الفيل الأزرق","تيتو","عوده","سكر هانم","صعيدي في الجامعة الأمريكية","همام في أمستردام","الناظر","الإرهاب والكباب","شارع الهرم","الأصليين","كده رضا","بوحة","عسل أسود","الكنز","أحمد زكي"]},
  fr:{n:"🎥 أفلام أجنبية",w:["تيتانيك","أفاتار","باتمان","الأب الروحي","ماتريكس","جوكر","إنسبشن","فروزن","شريك","حرب النجوم","جوراسيك بارك","هاري بوتر","سيد الخواتم","فاست آند فيوريوس","المنتقمون","توب جان","غلاديتور","أنتماني","كوكو","الأسد الملك"]},
  cars:{n:"🏎️ سيارات وتعديل",w:["مرسيدس","بي إم دبليو","لامبورجيني","فيراري","تويوتا","هيونداي","كيا","نيسان","تيربو","سبويلر","جنوط","فتيس يدوي","دريفت","رفع الشاسيه","عادم رياضي","شيفروليه","بورش","جيب رانجلر","ميتسوبيشي لانسر","تظليل زجاج"]},
  life:{n:"🏠 الحياة اليومية",w:["مروحة","ثلاجة","غسالة","مكنسة","حلة ضغط","شاحن","سرير","كوباية","مفتاح","مرايه","منبه","شنطة","نضارة","فرشة أسنان","مقص","سجادة","تليفزيون","ريموت","بطانية","وسادة"]},
  sport:{n:"⚽ كرة القدم والرياضة",w:["محمد صلاح","ميسي","رونالدو","الأهلي","الزمالك","ريال مدريد","برشلونة","كأس العالم","ضربة جزاء","ركلة ركنية","حارس مرمى","تسلل","ليفربول","مانشستر سيتي","كرة السلة","التنس","السباحة","الملاكمة","ملعب","حكم"]},
  geo:{n:"🌍 دول وعواصم",w:["القاهرة","باريس","لندن","طوكيو","روما","الرياض","دبي","مدريد","واشنطن","برلين","البرازيل","اليابان","كندا","تركيا","المغرب","الأردن","أستراليا","الهند","سويسرا","إسبانيا"]}
};
const DARES = ["اعمل 10 تمارين ضغط 💪","قلّد صوت حيوان يختاره الباقي 🐔","احكي نكتة ولازم الكل يضحك 😂","غنّي أغنية بصوت عالي 🎤","امشي زي البطريق لمدة دقيقة 🐧","اتكلم بلهجة غريبة لمدة 3 أدوار 🗣️","اعمل رقصة مضحكة 💃","قلّد أحد اللاعبين وهم يخمنون مين 🎭","قول اسمك بالعكس 3 مرات بسرعة","اعمل 15 قفزة مكانك 🏃","احكي موقف محرج حصل لك 😳","اعمل وش كوميدي وخليه 20 ثانية 🤪","اتكلم من غير ما تفتح بقك 😶","خلي حد يرسم على إيدك بقلم ✏️","اشرب كوباية ماء من غير ما تستخدم إيدك 🥤"];

/* ---------- صوت واهتزاز ---------- */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f,d,type="sine",vol=.25,when=0){ try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+d);}catch(e){} }
function noise(d,vol=.8,lp=3000,when=0){ try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=lp;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+when);}catch(e){} }
const sfx={
  click(){tone(900,.05,"square",.15);tone(500,.06,"square",.12,.05)},
  tick(){tone(1200,.03,"square",.1)},
  bang(){noise(.6,1,5000);tone(90,.4,"sawtooth",.4)},
  empty(){tone(300,.05,"square",.2);noise(.05,.3,1500)},
  beep(){tone(660,.18,"triangle",.3)},
  go(){tone(880,.5,"triangle",.35)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.3,i*.14))},
  tap(){tone(700,.05,"sine",.15)}
};
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ---------- حالة ---------- */
const $ = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
let S = { players: load("players",["","",""]), spies:1, cat:"islam", scores:{}, mode:null };
function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }
function save(){ try{ localStorage.setItem("players",JSON.stringify(S.players)); }catch(e){} }
const names = () => S.players.map(p=>p.trim()).filter(Boolean);
function show(html){ $.innerHTML=html; $.scrollTop=0; }
document.addEventListener("click",e=>{ if(e.target.closest("button,.cat,.gunwrap")) sfx.tap(); });

/* ---------- الرئيسية ---------- */
function home(){
  show(`<div class="logo-row"><span>🔫</span><span>🕵️‍♂️</span><span>💣</span></div><h1>الجاسوس حمزة</h1><p class="mut">🪖 معركة خداع وحظ — مين الجاسوس؟ 🪖</p>
  <div style="height:18px"></div>
  <h2>اختر نمط اللعب</h2>
  <button class="btn" onclick="startGroup()">👥 اللعب الجماعي<br><small style="font-weight:400">هاتف واحد يلف بين اللاعبين</small></button>
  <button class="btn dark" onclick="soloSetup()">🤖 اللعب الفردي ضد الهاتف<br><small style="font-weight:400">إنت ضد لاعبين يديرهم الهاتف</small></button>`);
}
function startGroup(){ S.solo=false; S.scores={}; S.players=load("players",["","",""]); playersScreen(); }
const BOTS=["🤖 سيف","🤖 ليلى","🤖 كريم","🤖 نور","🤖 مازن"];
function soloSetup(){
  S.solo=true; S.scores={};
  const me=(S.me!==undefined?S.me:load("me",""));
  S.me=me; S.nb=S.nb||3;
  show(`<div class="top"><button class="back" onclick="home()">→ رجوع</button></div>
  <h2>🤖 اللعب الفردي</h2>
  <div class="card"><p>اسمك</p><input type="text" maxlength="14" placeholder="اكتب اسمك" value="${esc(me)}" oninput="S.me=this.value">
  <p style="margin-top:14px">عدد لاعبي الهاتف</p>
  <div class="stepper"><button onclick="S.nb=Math.max(2,S.nb-1);soloSetup()">−</button><b>${S.nb}</b><button onclick="S.nb=Math.min(5,S.nb+1);soloSetup()">+</button></div></div>
  <button class="btn grn" onclick="soloNext()">متابعة</button>`);
}
function soloNext(){
  const me=(S.me||"").trim(); if(!me){alert("اكتب اسمك");return;}
  try{localStorage.setItem("me",JSON.stringify(me));}catch(e){}
  S.players=[me,...BOTS.slice(0,S.nb)]; S.scores={}; S.players.forEach(p=>S.scores[p]=0);
  sectionScreen();
}
function sectionScreen(){
  show(`<div class="top"><button class="back" onclick="${S.solo?"soloSetup()":"playersScreen()"}">→ رجوع</button></div>
  <div class="big">🎮</div><h2>اختر القسم</h2><p class="mut">${S.players.map(esc).join(" • ")}</p>
  <button class="btn red" onclick="rouletteStart()">🔫 أحكام الروليت</button>
  <button class="btn" onclick="spyEnter()">🕵️‍♂️ الجاسوس والعصابة</button>`);
}
function spyEnter(){ if(S.players.length<3){alert("لعبة الجاسوس تحتاج 3 لاعبين على الأقل");return;} spySetup(); }

/* ---------- إدخال اللاعبين ---------- */
function playersScreen(){
  const min = 2;
  show(`<div class="top"><button class="back" onclick="home()">→ رجوع</button></div>
  <h2>👥 اللاعبون</h2><p class="mut">اكتب أسماء اللاعبين (${min} على الأقل)</p>
  <div id="plist" style="width:100%"></div>
  <button class="btn dark" onclick="addP()">➕ إضافة لاعب</button>
  <button class="btn grn" onclick="playersNext()">متابعة</button>`);
  drawP();
}
function drawP(){
  document.getElementById("plist").innerHTML = S.players.map((p,i)=>`<div class="row"><input type="text" maxlength="14" placeholder="لاعب ${i+1}" value="${esc(p)}" oninput="S.players[${i}]=this.value"><button class="x" onclick="delP(${i})">✕</button></div>`).join("");
}
function addP(){ if(S.players.length<12){S.players.push("");drawP();} }
function delP(i){ if(S.players.length>2){S.players.splice(i,1);drawP();} }
function playersNext(){
  const n=names(), min=2;
  if(new Set(n).size!==n.length){alert("في أسماء مكررة!");return;}
  if(n.length<min){alert("لازم "+min+" لاعبين على الأقل");return;}
  S.players=n; save(); S.scores={};
  n.forEach(x=>{ S.scores[x]=0; });
  sectionScreen();
}

/* ---------- الروليت ---------- */
let R={};
function rouletteStart(){ R={turn:0,bullet:rnd(6),pos:0,rot:0,busy:false}; rouletteScreen(); }
function cylSVG(){
  let ch="";
  for(let i=0;i<6;i++){
    const a=i*60*Math.PI/180, x=100+Math.sin(a)*52, y=100-Math.cos(a)*52;
    ch+= i===0
     ? `<circle cx="${x}" cy="${y}" r="19" fill="#1a1208" stroke="#0a0a0a" stroke-width="3"/><circle cx="${x}" cy="${y}" r="15" fill="url(#brass)"/><circle cx="${x}" cy="${y}" r="7" fill="#7a5410" stroke="#e8c15a" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2.2" fill="#2b1b00"/>`
     : `<circle cx="${x}" cy="${y}" r="19" fill="#05060a" stroke="#6b7388" stroke-width="3"/><circle cx="${x}" cy="${y}" r="14" fill="#0b0d14"/><circle cx="${x-4}" cy="${y-4}" r="3" fill="#2a3042"/>`;
  }
  let fl=""; for(let i=0;i<6;i++){const a=(i*60+30)*Math.PI/180;fl+=`<circle cx="${100+Math.sin(a)*84}" cy="${100-Math.cos(a)*84}" r="11" fill="#171b27" opacity=".85"/>`;}
  return `<svg id="cylsvg" viewBox="0 0 200 200"><defs><radialGradient id="steelr" cx="40%" cy="35%"><stop offset="0" stop-color="#b8c0d2"/><stop offset=".55" stop-color="#6a7288"/><stop offset="1" stop-color="#2a3042"/></radialGradient><radialGradient id="brass" cx="35%" cy="30%"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#d9a02a"/><stop offset="1" stop-color="#7a5410"/></radialGradient></defs>
  <g id="cyl"><circle cx="100" cy="100" r="97" fill="url(#steelr)" stroke="#161a26" stroke-width="4"/>${fl}${ch}<circle cx="100" cy="100" r="15" fill="#20263a" stroke="#0a0c14" stroke-width="3"/><circle cx="100" cy="100" r="5" fill="#8a93aa"/></g></svg>`;
}
function gunSVG(){
  return `<svg viewBox="0 0 410 250"><defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd5e3"/><stop offset=".25" stop-color="#8a93a8"/><stop offset=".6" stop-color="#3d4458"/><stop offset="1" stop-color="#171b27"/></linearGradient>
  <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6379"/><stop offset="1" stop-color="#171b27"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9783a"/><stop offset=".5" stop-color="#7a4a1e"/><stop offset="1" stop-color="#3b2009"/></linearGradient>
  <radialGradient id="fl" cx="50%" cy="50%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffe066"/><stop offset=".7" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff2d00" stop-opacity="0"/></radialGradient></defs>
  <!-- grip -->
  <path d="M92 118 L156 116 L166 152 Q160 214 124 238 Q92 250 76 226 Q64 176 92 118Z" fill="url(#wood)" stroke="#1e1006" stroke-width="3"/>
  <g stroke="#1e1006" stroke-width="1.4" opacity=".55"><path d="M88 140 L148 138"/><path d="M84 158 L156 156"/><path d="M82 176 L156 174"/><path d="M82 194 L150 192"/><path d="M88 212 L138 210"/><path d="M104 124 L90 230"/><path d="M122 124 L106 238"/><path d="M140 124 L128 232"/></g>
  <circle cx="112" cy="180" r="8" fill="#9aa2b6" stroke="#1e2432" stroke-width="2"/>
  <!-- trigger guard + trigger -->
  <path d="M132 124 Q128 176 172 176 Q212 176 218 128" fill="none" stroke="url(#steel2)" stroke-width="9" stroke-linecap="round"/>
  <path d="M170 124 L160 156 Q166 160 176 156 L184 124Z" fill="#1a1f2d" stroke="#0a0c14" stroke-width="2"/>
  <!-- frame -->
  <path d="M64 74 Q60 64 74 62 L218 54 L232 118 L152 128 L96 128 Q66 124 64 98Z" fill="url(#steel)" stroke="#0e111a" stroke-width="3"/>
  <path d="M74 72 L216 64" stroke="#e8ecf6" stroke-width="2" opacity=".6"/>
  <!-- cylinder (side view) -->
  <rect x="150" y="58" width="76" height="62" rx="10" fill="url(#steel)" stroke="#0e111a" stroke-width="3"/>
  <g fill="#0e111a" opacity=".75"><rect x="164" y="64" width="10" height="50" rx="5"/><rect x="186" y="64" width="10" height="50" rx="5"/><rect x="208" y="64" width="10" height="50" rx="5"/></g>
  <rect x="150" y="58" width="76" height="8" rx="4" fill="#fff" opacity=".18"/>
  <!-- barrel -->
  <rect x="224" y="66" width="168" height="28" rx="3" fill="url(#steel)" stroke="#0e111a" stroke-width="3"/>
  <rect x="224" y="94" width="108" height="16" rx="3" fill="url(#steel2)" stroke="#0e111a" stroke-width="3"/>
  <rect x="226" y="68" width="164" height="5" fill="#fff" opacity=".28"/>
  <rect x="232" y="76" width="150" height="3" fill="#0e111a" opacity=".5"/>
  <polygon points="372,66 380,50 388,66" fill="#1a1f2d" stroke="#0e111a" stroke-width="2"/>
  <rect x="386" y="62" width="14" height="36" rx="3" fill="#10131c" stroke="#0a0c14" stroke-width="2"/>
  <ellipse cx="398" cy="80" rx="3" ry="9" fill="#000"/>
  <rect x="236" y="98" width="14" height="10" fill="#0e111a" opacity=".6"/>
  <!-- hammer -->
  <g id="hammer"><path d="M62 70 L44 40 Q50 32 62 36 L86 62Z" fill="url(#steel)" stroke="#0e111a" stroke-width="3"/><g stroke="#0e111a" stroke-width="1.6"><path d="M48 42 L58 36"/><path d="M52 48 L64 40"/><path d="M56 54 L70 46"/></g></g>
  <!-- engraving -->
  <text x="100" y="105" font-size="13" font-weight="800" fill="#0e111a" opacity=".55" font-family="Arial">MAGNUM .357</text>
  <!-- muzzle flash -->
  <g id="mflash"><polygon points="393,83 440,40 424,78 470,83 424,92 440,128 400,96 380,150 380,98 330,120 372,86 336,48 382,76" fill="url(#fl)"/></g>
  </svg>`;
}
const SAFE_SUB=["الحظ معاك يا وحش 😎","قلبي وقف! 💓","نجوت بأعجوبة 😅","يا بختك! 🍀","دي كانت قريبة قوي 😰","مسدس مسكين مالقاش حد 😂"];
const FIRE_SUB=["الله يرحمه 😂⚰️","سقط في ميدان المعركة 🪖","ابعتوله ورد 💐","جهزوا الحكم يا رجالة 😈","اتصاب إصابة مباشرة 🎯","الحظ خانه خيانة 😭"];
function rouletteScreen(){
  const p=S.players[R.turn%S.players.length];
  const bot=S.solo && R.turn%S.players.length!==0;
  show(`<div class="top"><button class="back" onclick="home()">→ الرئيسية</button><span class="mut">الجولة ${R.turn+1}</span></div>
  <h2>🔫 دور: <span class="pname">${esc(p)}</span></h2>
  <p class="${bot?"mut":"tapme"}">${bot?"الهاتف بيلعب دور "+esc(p)+" 🤖":"👇 اضغط على المسدس وخد الطلقة 😈"}</p>
  <div class="arena"><div class="ptr">▼</div>${cylSVG()}<div class="gunwrap" id="gun" onclick="pull()">${gunSVG()}</div></div>
  <div id="res" style="width:100%"></div>`);
  document.getElementById("cyl").style.transform=`rotate(${R.rot}deg)`;
  const tk=R.tk=(R.tk||0)+1;
  if(bot) setTimeout(()=>{ if(R.tk===tk && document.getElementById("gun")) pull(); },900);
}
function bulletHoles(){
  for(let i=0;i<7;i++){ const h=document.createElement("div"); h.className="hole"; h.style.left=rnd(88)+"vw"; h.style.top=(8+rnd(80))+"vh"; document.body.appendChild(h); setTimeout(()=>h.remove(),3500); }
  const sm=document.createElement("div"); sm.className="smoke"; sm.textContent="💨"; sm.style.left="55vw"; sm.style.top="55vh"; document.body.appendChild(sm); setTimeout(()=>sm.remove(),2100);
}
function pull(){
  if(R.busy) return; R.busy=true; ac();
  const fired = R.pos===R.bullet, target = fired?0:1+rnd(5);
  const cur=((R.rot%360)+360)%360, delta=((-target*60-cur)%360+360)%360;
  R.rot += 1080+delta;
  const cyl=document.getElementById("cyl"); cyl.style.transform=`rotate(${R.rot}deg)`;
  const hm=document.getElementById("hammer"); if(hm) hm.classList.add("cock");
  let t=0,gap=55; while(t<1550){ setTimeout(()=>{ if(document.getElementById("cyl")){sfx.tick();vib(18);} },t); t+=gap; gap*=1.17; }
  setTimeout(()=>{ const h=document.getElementById("hammer"); if(h){h.classList.add("fall");} sfx.click(); },1750);
  setTimeout(()=>{
    const res=document.getElementById("res"); if(!res){R.busy=false;return;}
    const p=S.players[R.turn%S.players.length];
    const isBot = S.solo && R.turn%S.players.length!==0;
    const g=document.getElementById("gun"), mf=document.getElementById("mflash");
    if(fired){
      sfx.bang(); vib([500,60,400,60,700]);
      if(g) g.classList.add("recoil"); if(mf) mf.classList.add("go");
      document.body.classList.add("flash"); $.classList.add("shake"); bulletHoles();
      setTimeout(()=>{document.body.classList.remove("flash");$.classList.remove("shake")},650);
      R.bullet=rnd(6); R.pos=0;
      if(isBot){
        res.innerHTML=`<div class="card result" style="text-align:center;border:2px solid var(--red)"><div class="big">💥</div><h2 style="color:var(--red)">${esc(p)} اتضرب! 😂</h2><p>${FIRE_SUB[rnd(FIRE_SUB.length)]}</p><button class="btn grn" onclick="R.turn++;R.busy=false;rouletteScreen()">التالي ←</button></div>`;
      } else {
        res.innerHTML=`<div class="card result" style="text-align:center;border:2px solid var(--red)"><div class="big">💥</div><h2 style="color:var(--red)">تم إطلاق النار عليك!</h2><p>${FIRE_SUB[rnd(FIRE_SUB.length)]}<br><b>${esc(p)}</b> لازم ينفذ حكم</p>
        <button class="btn gold" onclick="punish('players')">👥 حكم اللاعبين</button><button class="btn" onclick="punish('game')">🎲 حكم اللعبة</button></div>`;
      }
    } else {
      sfx.empty(); vib(80); R.pos++;
      res.innerHTML=`<div class="card result" style="text-align:center;border:2px solid var(--grn)"><div class="big">😮‍💨</div><h2 style="color:var(--grn)">مكتوب لك أن تستكمل حياتك!</h2><p>${SAFE_SUB[rnd(SAFE_SUB.length)]}<br>طلقة فارغة — الدور على اللاعب التالي</p><button class="btn grn" onclick="R.turn++;R.busy=false;rouletteScreen()">التالي ←</button></div>`;
    }
    res.scrollIntoView({behavior:"smooth",block:"end"});
  },1850);
}
function punish(kind){
  const p=S.players[R.turn%S.players.length];
  const txt = kind==="game" ? `<div class="word" style="font-size:28px;color:var(--gold)">${DARES[rnd(DARES.length)]}</div>` : `<p>اتفقوا يا شباب على حكم حر لـ <b>${esc(p)}</b> 😈</p>`;
  show(`<div class="big">⚖️</div><h2>حكم ${esc(p)}</h2><div class="card">${txt}</div>
  ${kind==="game"?`<button class="btn dark" onclick="punish('game')">🔄 حكم آخر</button>`:""}
  <button class="btn grn" onclick="R.turn++;R.busy=false;rouletteScreen()">تم التنفيذ ✔ — اللاعب التالي</button>`);
}

/* ---------- الجاسوس: الإعدادات ---------- */
function spySetup(){
  const n=S.players.length, max=Math.max(1,Math.floor((n-1)/2));
  if(S.spies>max) S.spies=max;
  show(`<div class="top"><button class="back" onclick="sectionScreen()">→ رجوع</button></div>
  <h2>⚙️ الإعدادات</h2>
  <div class="card"><p>عدد اللاعبين: <b>${n}</b></p><p>عدد الجواسيس</p>
  <div class="stepper"><button onclick="S.spies=Math.max(1,S.spies-1);spySetup()">−</button><b>${S.spies}</b><button onclick="S.spies=Math.min(${max},S.spies+1);spySetup()">+</button></div></div>
  <h2>📂 اختر الفئة</h2>
  <div class="grid">${Object.entries(CATS).map(([k,c])=>`<div class="cat ${S.cat===k?"sel":""}" onclick="S.cat='${k}';spySetup()">${c.n}</div>`).join("")}
  <div class="cat ${S.cat==="random"?"sel":""}" onclick="S.cat='random';spySetup()">🎲 عشوائي</div></div>
  <button class="btn grn" style="margin-top:14px" onclick="spyStart()">🚀 ابدأ الجولة</button>`);
}
let G={};
function spyStart(){
  const n=S.players.length;
  const key = S.cat==="random" ? Object.keys(CATS)[rnd(Object.keys(CATS).length)] : S.cat;
  const words=CATS[key].w, word=words[rnd(words.length)];
  const spies=shuffle([...Array(n).keys()]).slice(0,S.spies);
  G={key,word,spies,i:0,votes:[],guess:{}};
  if(S.solo){ G.i=0; roleScreen(); } else passScreen();
}
function passScreen(){
  show(`<div class="big">📱</div><h2>مرر الهاتف إلى</h2><div class="word" style="color:var(--gold)">${esc(S.players[G.i])}</div><p class="mut">هل أنت جاهز؟ لا تخلي حد يشوف الشاشة</p>
  <button class="btn grn" onclick="roleScreen()">✅ أنا جاهز</button>`);
}
function roleScreen(){
  const isSpy=G.spies.includes(G.i);
  show(`<div class="big">${isSpy?"🕵️":"🎭"}</div>
  ${isSpy?`<p>دورك</p><div class="word spyword">جاسوس</div><p class="mut">مش عارف الكلمة السرية — اتخفى وحاول تعرفها من كلام الباقي</p>`
  :`<p>الكلمة السرية</p><div class="word">${esc(G.word)}</div><p class="mut">أنت من العصابة — اكشف الجاسوس من غير ما تقول الكلمة صراحة</p>`}
  ${S.solo?`<button class="btn grn" onclick="questionsStart()">تم، ابدأ ←</button>`:`<button class="btn dark" onclick="nextRole()">تم، مرر الهاتف لغيري</button>`}`);
}
function nextRole(){ G.i++; if(G.i<S.players.length) passScreen(); else questionsStart(); }

/* ---------- الفردي ---------- */
function botVotes(){
  const n=S.players.length;
  for(let b=1;b<n;b++){
    const others=[...Array(n).keys()].filter(j=>j!==b);
    G.votes[b]=others[rnd(others.length)];
  }
}

/* ---------- الأسئلة ---------- */
const TIPS=["هل بتحبها؟ 😍","شكلها أو لونها عامل إزاي؟","هتلاقيها فين عادةً؟","بتستخدمها كل يوم؟","لو كانت حيوان هتبقى إيه؟","سعرها غالي ولا رخيص؟","تفتكر أمك تعرفها؟ 👵","لو هتديها هدية لمين؟","إمتى آخر مرة شفتها؟","كبيرة ولا صغيرة؟"];
function questionsStart(){ G.asker=rnd(S.players.length); questionTurn(true); }
function questionTurn(first){
  if(!first){ G.asker=G.asked; }
  let t; do{ t=rnd(S.players.length); }while(t===G.asker || (S.players.length>2 && t===G.prevAsker));
  G.prevAsker=G.asker; G.asked=t;
  show(`<div class="big">❓</div><h2>جولة الأسئلة</h2>
  <div class="card" style="text-align:center"><p>دور اللاعب</p><div class="word" style="color:var(--gold);margin:4px 0">${esc(S.players[G.asker])}</div><p>اسأل اللاعب</p><div class="word" style="color:var(--blue);margin:4px 0">${esc(S.players[G.asked])}</div></div>
  ${S.solo&&(G.asker===0||G.asked===0)?`<p class="pname" style="font-weight:800">⚡ الدور عليك إنت!</p>`:""}
  <div class="tip">💡 فكرة سؤال: ${TIPS[rnd(TIPS.length)]}</div>
  <button class="btn" onclick="questionTurn(false)">التالي ←</button>
  <button class="btn red" onclick="voteStart()">🏁 النهاية والانتقال للإجابة</button>`);
}

/* ---------- التصويت ---------- */
function voteStart(){ G.v=0; G.votes=[]; S.solo?voteChoose():votePass(); }
function votePass(){
  show(`<div class="big">🗳️</div><h2>التصويت السري</h2><p>سلّم الهاتف إلى</p><div class="word" style="color:var(--gold)">${esc(S.players[G.v])}</div>
  <button class="btn grn" onclick="voteChoose()">✅ أنا جاهز</button>`);
}
function voteChoose(){
  show(`<h2>مين تشك إنه الجاسوس؟</h2><p class="mut">${esc(S.players[G.v])}، اختار بسرية</p>
  <div class="grid">${S.players.map((p,i)=>i===G.v?"":`<div class="cat" onclick="castVote(${i})">${esc(p)}</div>`).join("")}</div>`);
}
function castVote(i){
  G.votes[G.v]=i;
  if(S.solo){ botVotes(); readyScreen(); return; }
  G.v++; G.v<S.players.length?votePass():readyScreen();
}

/* ---------- العد التنازلي ---------- */
function readyScreen(){
  show(`<div class="big">🎬</div><h2>جاهزين لعرض مين الجاسوس؟</h2><button class="btn red" onclick="countdown()">🔥 جاهزين!</button>`);
}
function countdown(){
  ac(); let c=3;
  const step=()=>{
    if(c>0){ show(`<div style="margin-top:12vh"><div class="cd">${c}</div></div>`); sfx.beep(); vib(120); c--; setTimeout(step,1000); }
    else { sfx.go(); vib([200,80,400]); revealSpies(); }
  };
  step();
}
function confetti(){ const e=["🎉","✨","🎊","⭐","🔥"]; for(let i=0;i<30;i++){const d=document.createElement("div");d.className="confetti";d.textContent=e[rnd(e.length)];d.style.left=rnd(100)+"vw";d.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4500);} }
function revealSpies(){
  sfx.win(); confetti();
  show(`<div class="big">🕵️‍♂️</div><h2>${G.spies.length>1?"الجواسيس هم":"الجاسوس هو"}</h2>
  ${G.spies.map(i=>`<div class="spyname">${esc(S.players[i])}</div>`).join("")}
  <p class="mut" style="margin-top:14px">دلوقتي كل جاسوس عنده فرصة أخيرة يخمن الكلمة!</p>
  <button class="btn gold" onclick="G.s=0;nextGuess()">${G.spies.length>1||!S.solo?"فرصة النجاة ←":"عرض النتيجة ←"}</button>`);
}

/* ---------- فرصة الجاسوس ---------- */
function spyGuessPass(){
  const si=G.spies[G.s];
  show(`<div class="big">📱</div><h2>سلّم الهاتف للجاسوس</h2><div class="word spyword" style="font-size:38px">${esc(S.players[si])}</div><p class="mut">باقي اللاعبين ما يبصوش!</p>
  <button class="btn red" onclick="spyGuessChoose()">✅ أنا جاهز</button>`);
}
function spyGuessChoose(){
  const pool=CATS[G.key].w.filter(w=>w!==G.word);
  const opts=shuffle([G.word,...shuffle(pool).slice(0,7)]);
  show(`<h2>خمّن الكلمة السرية</h2><p class="mut">اختار الكلمة اللي تظن إن العصابة شافتها</p>
  <div class="grid">${opts.map(o=>`<div class="cat" data-w="${esc(o)}" onclick="spyGuess(this.dataset.w)">${esc(o)}</div>`).join("")}</div>`);
}
function spyGuess(w){
  G.guess[G.spies[G.s]] = (w===G.word);
  G.s++; nextGuess();
}
function nextGuess(){
  while(G.s<G.spies.length){
    const s=G.spies[G.s];
    if(S.solo && s!==0){ G.guess[s]=Math.random()<.35; G.s++; continue; }
    if(S.solo){ spyGuessChoose(); return; }
    spyGuessPass(); return;
  }
  scoreRound();
}

/* ---------- النقاط ---------- */
function scoreRound(){
  const gain={}; S.players.forEach(p=>gain[p]=0);
  const caught={}; G.spies.forEach(s=>caught[s]=false);
  S.players.forEach((_,i)=>{
    if(G.spies.includes(i)) return;
    const v=G.votes[i];
    if(G.spies.includes(v)){ caught[v]=true; gain[S.players[i]]+=100; }
  });
  G.spies.forEach(s=>{
    if(G.guess[s]) gain[S.players[s]] += caught[s]?100:200;
  });
  Object.keys(gain).forEach(p=>S.scores[p]=(S.scores[p]||0)+gain[p]);
  const lines=G.spies.map(s=>`<div class="rank"><span>🕵️ ${esc(S.players[s])}</span><span>${G.guess[s]?(caught[s]?"خمّن صح — اتكشف (+100)":"خمّن صح ومحدش عرفه 🤯 (+200)"):"غلط (0)"}</span></div>`).join("");
  show(`<h2>📋 ملخص الجولة</h2><div class="card" style="text-align:center"><p class="mut">الكلمة السرية كانت</p><div class="word" style="margin:4px 0">${esc(G.word)}</div></div>${lines}
  <h2 style="margin-top:12px">من كشف الجاسوس</h2>
  ${S.players.map((p,i)=>G.spies.includes(i)?"":`<div class="rank"><span>${esc(p)}</span><span>صوّت لـ ${esc(S.players[G.votes[i]])} ${G.spies.includes(G.votes[i])?"✅ +100":"❌"}</span></div>`).join("")}
  <button class="btn gold" onclick="leaderboard()">🏆 لوحة الشرف</button>`);
}
function leaderboard(){
  const rows=Object.entries(S.scores).filter(([p])=>S.players.includes(p)).sort((a,b)=>b[1]-a[1]);
  const medals=["🥇","🥈","🥉"];
  show(`<div class="big">🏆</div><h2>لوحة الشرف</h2>
  ${rows.map(([p,s],i)=>`<div class="rank ${i===0?"first":""}"><span>${medals[i]||(i+1)+"."} ${esc(p)}</span><b>${s}</b></div>`).join("")}
  <button class="btn grn" style="margin-top:14px" onclick="spySetup()">🔄 جولة أخرى</button>
  <button class="btn dark" onclick="S.scores={};home()">🏁 إنهاء</button>`);
  sfx.win(); confetti();
}

home();
</script>
</body>
</html>
